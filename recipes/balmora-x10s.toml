# Arm B, Balmora 2.0 (docs/specs/settlements.md "First comparison"): no kept part, both banks of the new Odai in the 10x world.
# Same values as arm A except crop, the absent claim (the [claim] table is unused without a site claim) and the founding
# [crossing] (arm A gets its regional roads from the claim exits). Relief 0.25 as arm A (ST-3e, see its source).
# Recipe for `settle` (docs/specs/settlements.md "Tunables"). Every value carries its unit and its source;
# `Guess` is allowed and counted, as in Scrib's superfargoth/docs/specs/tunables.md.

[cultures]
value = ["european-organic", "medina", "korean"]
unit = "Magna Urbis culture id"
source = "Guess: three contrasting tissues (organic, dense walled, grid) for a first side-by-side; ids from Magna Urbis urban/catalogue.json"

[population]
value = 3000
unit = "inhabitants"
source = "Same as arm A (recipes/balmora-vanilla.toml, where 3000 gave about 10x the kept built area), so the two arms compare at one size"

[seed]
value = "settle-example-1"
unit = "seed string"
source = "Guess"

[crop_radius_m]
value = 1400.0
unit = "m (half side of the square crop, centred on centre_m)"
source = "Guess: the ST-2 site keeps ~1 km of ground around a town of 10x vanilla Balmora's built area (~1.1 x 0.6 km); the site crop is 1500 m"

[raster_spacing_m]
value = 5.0
unit = "m per planning cell"
source = "Guess: a 30 m river spans 6 cells; Magna Urbis routes water on this grid (surface.rs:91)"

[site_radius_m]
value = 0.0
unit = "m (0 = Magna Urbis settlements::extent_radius(population))"
source = "Magna Urbis settlements/mod.rs:655"

[water_class]
value = "river"
unit = "Magna Urbis water class (sea | lake | river)"
source = "Guess: inland site; codes from Magna Urbis settlements/placement.rs:1120-1124"

[relief_scale]
value = 0.25
unit = "ratio (planned height above the water level / site height above it)"
source = "Measured 2026-11-24 (ST-3e) on target/worldgen/sites/balmora-x10s: the river runs in a gorge (banks 23-25 m above the water, terraces between cliff bands); the 300 m disk median slope 0.083 hides it (p75 0.455), the dry ground within 300 m of the channel has median 0.21-0.22, only ~40 % under Magna Urbis's 0.12 street grade (urban/config.rs:342). At 1.0 no quarter street routes (107 lots, one bank); 0.5 still leaves one bank for all three cultures; 0.25 (arm A's value) gives both. A planning stand-in for terrain grading (docs/specs/settlements.md Relief)"

[min_water_area_m2]
value = 2500.0
unit = "m2 (4-connected water body on the site raster)"
source = "Guess: one 50 m cell, the region cell of Magna Urbis's placement tests (settlements/placement.rs:1146), so no body below its region resolution reaches the town stage; drops puddle-sized swamp pools"

[sheet_m_per_px]
value = 2.0
unit = "m per pixel"
source = "Guess: a 2 km crop is a 1000 px sheet, lots of 10 m wide stay readable"

# The founding crossing (crates/settle/src/crossing.rs): the regional road Magna Urbis's region stage would give a
# river town, which its town stage spans the river through (urban/footprint/growth.rs:219). Arm B has no claim, so no
# road: a cliff-banked river kept the town on one bank (ST-3e, tests/gorge_river.rs).
[crossing.search_m]
value = 300.0
unit = "m (nearest water the crossing starts from, from the centre)"
source = "Guess: about Magna Urbis's extent radius for 3000 people (settlements/mod.rs:655, 271 m); a town farther from water is not a river town"

[crossing.max_span_m]
value = 400.0
unit = "m of water along the crossing line"
source = "Magna Urbis's longest urban crossing span (urban/footprint/crossings.rs:133, clamp 400 m); wider water is a lake or sea, not bridged"

[crossing.angle_step_deg]
value = 5.0
unit = "degrees between the crossing lines tried"
source = "Guess: at 5 degrees a 200 m span is within 0.1 % of its perpendicular width"

[crossing.reach_m]
value = 1000.0
unit = "m of road each way from the crossing's middle (clipped to the crop)"
source = "Magna Urbis's own river-town tests feed a straight regional road of 1-2 km (urban/kinds_camp_mapping_tests.rs:12, urban/footprint/crossings.rs:1002)"

[crossing.width_m]
value = 6.0
unit = "m (carriageway)"
source = "Magna Urbis's regional road width in its town tests (urban/kinds_camp_mapping_tests.rs:12, urban/composition_faubourgs_tests.rs:7)"

[crossing.rank]
value = 1
unit = "Magna Urbis street rank (0 highway, 1 main, 2 local)"
source = "A main road between towns: rank 1 for the 'main' class in Magna Urbis's regional streets (rust/bridge/urbanRoads.ts:11)"

# The kept town (site.json `claim`, arm A) as Magna Urbis's Claim (crates/settle/src/claim.rs). Ignored by sites
# without a claim.
[claim.cell_m]
value = 1.0
unit = "m per raster cell"
source = "Guess: a third of Magna Urbis's own claim cell (urban/neighbours.rs:57, 3 m), so 3-5 m alleys between kept buildings resolve"

[claim.margin_m]
value = 4.0
unit = "m (footprints grown by it before closing)"
source = "Guess: the yard, eaves and doorstep a kept building holds; Magna Urbis adds its own 8 m clear band beyond the land (urban/neighbours.rs:53)"

[claim.close_m]
value = 12.0
unit = "m (closing radius)"
source = "Magna Urbis's claim closing (urban/neighbours.rs:59): blocks across a street merge into one outline"

[claim.simplify_m]
value = 2.0
unit = "m (Douglas-Peucker tolerance of outlines and exits)"
source = "Magna Urbis's claim simplification (urban/neighbours.rs:61)"

[claim.min_hole_m2]
value = 2500.0
unit = "m2"
source = "Magna Urbis's claim hole fill (urban/neighbours.rs:63)"

[claim.min_land_m2]
value = 200.0
unit = "m2"
source = "Guess: Magna Urbis drops claim pieces under 100 m2 (urban/neighbours.rs:64); a lone prop grown by the margin is 50-80 m2, a lone hut about 250 m2"

[claim.exit_in_m]
value = 60.0
unit = "m (exit length inside the kept land)"
source = "Magna Urbis's claim street stub (urban/neighbours.rs:67)"

[claim.exit_out_m]
value = 60.0
unit = "m (exit traced outward along road texels)"
source = "Magna Urbis's claim street stub (urban/neighbours.rs:67); its join reaches 40 m beyond (:71)"

[claim.exit_min_m]
value = 20.0
unit = "m (shortest outward run of an exit)"
source = "Guess: Magna Urbis's edge distance for a dead end pointing out (urban/neighbours.rs:68); shorter runs are roads along the edge"

[claim.exit_merge_m]
value = 20.0
unit = "m (outer ends closer than this are one exit)"
source = "Guess: about two road widths, so a road leaving through two gaps is one exit"

[claim.exit_width_m]
value = 5.0
unit = "m (exit street width)"
source = "Guess: Magna Urbis's street width for a routed access street (urban/footprint/generate.rs:102)"

[claim.join_tolerance_m]
value = 1.0
unit = "m (a new street ending this close to an exit joins it; stats only)"
source = "Guess: Magna Urbis's connectors end exactly on the claim street (urban/neighbours.rs:513, :536); 1 m leaves float room"

# Fitting kit buildings into Magna Urbis's building footprints (crates/settle/src/fit.rs, slice PL-2). The kit path
# is machine-specific: pass `settle --kit <kit.json>` (or set `kit = "..."` here, relative to this file).
[fit.slide_step_m]
value = 1.0
unit = "m between frontage positions"
source = "Guess: a tenth of a 10 m house front; finer steps only move a fitted hull, the covered share is per model"

[fit.slide_max]
value = 9
unit = "positions per model and turn (centre, then outward both ways)"
source = "Guess: with 1 m steps, up to 4 m either side of the centre"

[fit.setback_m]
value = 0.0
unit = "m (door side behind the footprint's front edge)"
source = "Magna Urbis draws its footprints on the building line of the lot (urban/building_sites.rs:1371); 0 keeps the door side on it"

[fit.inside_tolerance_m]
value = 0.05
unit = "m (a hull may stand this far outside its footprint)"
source = "Measured 2026-11-24 (PL-0): Magna Urbis's parts stand up to 3 cm outside their lot (tests/common INSIDE_TOLERANCE_M = 0.05)"

[fit.overlap_tolerance_m]
value = 0.05
unit = "m (interpenetration still counted as touching)"
source = "Guess: the same slop as the inside test, so two hulls on a shared footprint edge touch"

[fit.door_probe_m]
value = 1.0
unit = "m outside the street door"
source = "Guess: a doorstep; the pad is the street ground in front of the door"

[fit.ground_sample_m]
value = 1.0
unit = "m between ground samples under a hull"
source = "Guess: about half the site raster cell (1.83 m on balmora-x10s, site.json cell_m), so every cell under a hull is read"

[fit.pad_rise_max_m]
value = 1.0
unit = "m (ground above the pad under the hull)"
source = "Guess: a plinth course; more buries the walls (grading, PL-4, will cut the pad instead)"

[fit.score_margin]
value = 0.1
unit = "covered share of the footprint (0..1)"
source = "Guess: models within 10 points of the best fit are drawn by kit weight, so a row is not one model"

[fit.back_door_tolerance_deg]
value = 45.0
unit = "degrees from the first door's opposite"
source = "Guess: a door nearer the back than a side counts as a back door"

# Joining narrow empty lots along their street until a kit building fits (crates/settle/src/merge.rs, slice PL-3a):
# the medina's continuous street wall (owner 2026-11-24).
[merge.max_lots]
value = 3
unit = "lots joined under one building"
source = "Guess: medina parts are ~9 m wide and Hlaalu fronts 6-24 m (kit.json), so three plots cover the widest house"

[merge.max_front_m]
value = 24.0
unit = "m of frontage (members' access segments summed)"
source = "Guess: the widest Hlaalu house front, 23.7 m (ex_hlaalu_b_24 in the balmora kit); a wider group fits nothing more"

[merge.min_shared_m]
value = 2.0
unit = "m of shared lot boundary"
source = "Guess: a party wall, not a corner touch; Magna Urbis's plots share whole side edges"

[merge.shared_tolerance_m]
value = 0.1
unit = "m (two lot edges this close are one boundary)"
source = "Guess: Magna Urbis's partition shares exact edges; 0.1 m leaves float room and is far below any lot width"

[merge.max_angle_deg]
value = 20.0
unit = "degrees between two neighbours' street normals"
source = "Guess: a winding medina lane turns a few degrees per plot; a street corner turns 60-90"

[merge.max_offset_m]
value = 1.5
unit = "m (the nearer end of a neighbour's frontage off the other's frontage line; also the street-face reach)"
source = "Guess: building lines on one lane wander by less than a metre; a lot behind or across a lane is a lot depth away"

[merge.max_gap_m]
value = 1.0
unit = "m along the street between two neighbours' street faces"
source = "Guess: adjacent plots' street faces end on their shared corner (gap 0); 1 m leaves float room"

# Closing the street wall (crates/settle/src/filler.rs, slice PL-3b): kit walls along the lot faces no building
# covers, arches across lane mouths (owner 2026-11-24: houses, Hlaalu walls between them, and arches).
[filler.walls]
value = ["meshes/x/ex_hlaalu_wall_01.nif", "meshes/x/ex_hlaalu_wall_up_01.nif", "meshes/x/ex_hlaalu_wall_up_02.nif"]
unit = "kit model ids, in order of preference"
source = "balmora kit.json: the Hlaalu wall pieces (3.66 m long, h 7.5; up_01 3.66 m, h 9.3; up_02 11 m, h 12.9)"

[filler.arches]
value = ["meshes/x/ex_hlaalu_wall_gate_01.nif", "meshes/x/ex_hlaalu_wall_gate_02.nif", "meshes/x/ex_hlaalu_wall_gate_03.nif"]
unit = "kit model ids"
source = "balmora kit.json: the Hlaalu gates (3.66, 5.49 and 7.32 m wide)"

[filler.cover_depth_m]
value = 6.0
unit = "m behind the face line"
source = "Guess: a house stands back from its lot face by the fit's setback plus Magna Urbis's front yard (a few m); a wall must never run in front of it"

[filler.min_gap_m]
value = 0.5
unit = "m of uncovered face"
source = "Guess: below half a metre a gap is float noise or an eave's shadow, not an opening"

[filler.overlap_max_m]
value = 0.5
unit = "m (wall run past a building end, pieces over each other, piece into a hull)"
source = "Guess: about a quarter of the Hlaalu wall's 2.3 m depth; hides inside the end post and the house's wall"

[filler.length_tie_m]
value = 0.05
unit = "m between two combinations' summed lengths"
source = "Guess: 5 cm, below what shows; three 3.66 m pieces and one 11 m piece tie, so the plain wall wins"

[filler.arch_slack_m]
value = 0.5
unit = "m each way around the arches' widths"
source = "Guess: the gate pieces' end posts take half a metre of misfit either way"

# Magna Urbis's own options (camelCase, as its LayoutConfig / ParcelConfig name them); empty = its defaults.
[magna_urbis.layout]
[magna_urbis.parcels]
