[filler.tower_turn_deg]
value = 15.0
unit = "degrees of turn between two members' street faces"
source = "Guess: under merge.max_angle_deg (20, the most a run turns per plot); a 15 degree kink reads as a corner, a lane's few-degree wander does not (MU urban/types.rs Enclosure.towers: corners after gates)"

[filler.tower_min_spacing_m]
value = 80.0
unit = "m between two towers' corner points"
