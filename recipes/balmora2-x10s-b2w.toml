# Magna Urbis's own options (camelCase, as its LayoutConfig / ParcelConfig name them); empty = its defaults.
[magna_urbis.layout]
tissue = "terraces"
maxStairGrade = 1.0
maxLaneGrade = 0.4
# Owner 2026-11-24, arm hm: denser tissue (MU caps density at 2, urban/morph.rs:137), every town lot builds behind its house,
# block houses and plots from the `hlaalu` culture (mediterranean-modern sized for the Hlaalu kit, culture pack
# cultures/hlaalu.toml) on medina streets.
density = 2.0
backBuildings = 1.0
[magna_urbis.layout.footprint]
# Owner 2026-11-24, arm c1 "perfect": land from the population at 200 people/ha (the only MU mode with districts and
# harbour planning; MU grows the town over the reachable flats). c1 also moved the site centre 200 m west, 380 m south
# onto the plains (scratchpad site copy): the real site export must carry that centre (next slice).
budget = "population"
grossDensity = 200.0
[magna_urbis.layout.styleSheet.houses.city]
styles = [{ culture = "hlaalu", weight = 1.0 }]
[magna_urbis.layout.styleSheet.plots.city]
styles = [{ culture = "hlaalu", weight = 1.0 }]
[magna_urbis.parcels]
