  { class = "main", surface = "flagstone" },
  { class = "main", surface = "flagstone" },
  { class = "local", surface = "cobble" },
  { class = "trail", surface = "dirt" },
  { class = "trail", surface = "dirt" },
]
unit = "road network v1 class + surface per Magna Urbis street rank (index = rank 0..4; past the end = last)"
source = "Brief S1a 2026-11-24: main/arterial streets main + flagstone, ordinary streets local + cobble, lanes and closes trail + dirt; Magna Urbis ranks on balmora-x10s-b2w medina: 1 gate-street/street/market, 2 street/wall-lane, 3 lane/path, 4 close/track/stairs/path"

[streets.by_role]
unit = "road network v1 class + surface per Magna Urbis street role (overrides by_rank)"
source = "Brief S1a 2026-11-24: lanes, alleys and dead ends trail + dirt; Guess: wall-lane is a lane along the wall, track a farm track, stairs stone steps"
[streets.by_role.value]
lane = { class = "trail", surface = "dirt" }
"wall-lane" = { class = "trail", surface = "dirt" }
close = { class = "trail", surface = "dirt" }
path = { class = "trail", surface = "dirt" }
track = { class = "track", surface = "dirt" }
stairs = { class = "trail", surface = "flagstone" }

